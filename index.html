<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tablero Familiar</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      /* Fondo ambiental estilo Echo Show */
      background: #0d1117 url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1024&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      font-family: -apple-system, Helvetica Neue, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Capa oscura para legibilidad */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.65) 100%);
      padding: 24px;
      display: table;
      width: 100%;
      height: 100%;
    }

    .main-row {
      display: table-row;
      height: 85%;
    }

    .col-left {
      display: table-cell;
      vertical-align: bottom;
      width: 55%;
      padding-right: 20px;
      padding-bottom: 10px;
    }

    .col-right {
      display: table-cell;
      vertical-align: top;
      width: 45%;
    }

    /* Reloj y fecha gigante estilo Echo Show */
    .weather-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 18px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .clock-big {
      font-size: 88px;
      font-weight: 200;
      line-height: 1;
      letter-spacing: -2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .date-sub {
      font-size: 22px;
      font-weight: 400;
      color: #e0e6ed;
      margin-top: 6px;
      text-transform: capitalize;
    }

    /* Tarjetas translúcidas */
    .widget-card {
      background: rgba(18, 24, 34, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .widget-header {
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #38bdf8;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .event-item {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 16px;
    }
    .event-item:last-child { border-bottom: none; }
    .event-time {
      color: #38bdf8;
      font-weight: bold;
      font-size: 13px;
      display: block;
    }

    /* Botón de conexión */
    .btn-alexa {
      background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 114, 255, 0.4);
    }

    /* Barra inferior luminosa estilo Alexa+ */
    .alexa-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #0051ff, #00e1ff, #0051ff);
      box-shadow: 0 -2px 15px #00e1ff;
    }
  </style>

  <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>

  <div class="overlay">
    <div class="main-row">
      
      <!-- Izquierda: Clima, Reloj Gigante y Fecha -->
      <div class="col-left">
        <div class="weather-badge" id="weather-box">☀️ Hermosillo • 29°C Despejado</div>
        <div class="clock-big" id="time-display">09:27</div>
        <div class="date-sub" id="date-display">Domingo, 15 de Noviembre</div>
      </div>

      <!-- Derecha: Tarjetas Inteligentes -->
      <div class="col-right">
        <div class="widget-card" id="auth-card">
          <div class="widget-header">Cuenta Familiar</div>
          <button class="btn-alexa" onclick="handleAuthClick()">Sincronizar Google Calendar</button>
        </div>

        <div class="widget-card">
          <div class="widget-header">Próximos Eventos</div>
          <div id="events-list">
            <div class="event-item" style="color: #aaa;">Conecta tu cuenta para ver la agenda de hoy...</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Barra de luz inferior estilo Alexa -->
  <div class="alexa-bar"></div>

  <script>
    // --- CREDENCIALES ---
    var CLIENT_ID = '969068172702-q4gu770127dbn4dpnlfjetuv772tpl5o.apps.googleusercontent.com';
    var API_KEY = 'AQUÍ_VA_TU_API_KEY'; // <<--- PEGA AQUÍ TU API KEY REAL
    var DISCOVERY_DOCS = ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"];
    var SCOPES = "https://www.googleapis.com/auth/calendar.readonly";

    // Reloj y Fecha en Español (Compatible iOS 9)
    var dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    var meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

    function updateClock() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      h = (h < 10 ? '0' : '') + h;
      m = (m < 10 ? '0' : '') + m;
      document.getElementById('time-display').innerText = h + ":" + m;

      var diaSemana = dias[now.getDay()];
      var diaMes = now.getDate();
      var mes = meses[now.getMonth()];
      document.getElementById('date-display').innerText = diaSemana + ", " + diaMes + " de " + mes;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Google API
    function handleClientLoad() {
      gapi.load('client:auth2', initClient);
    }

    function initClient() {
      gapi.client.init({
        apiKey: API_KEY,
        clientId: CLIENT_ID,
        discoveryDocs: DISCOVERY_DOCS,
        scope: SCOPES
      }).then(function () {
        if (gapi.auth2.getAuthInstance().isSignedIn.get()) {
          document.getElementById('auth-card').style.display = 'none';
          listUpcomingEvents();
        }
      });
    }

    function handleAuthClick() {
      gapi.auth2.getAuthInstance().signIn().then(function() {
        document.getElementById('auth-card').style.display = 'none';
        listUpcomingEvents();
      });
    }

    function listUpcomingEvents() {
      gapi.client.calendar.events.list({
        'calendarId': 'primary',
        'timeMin': (new Date()).toISOString(),
        'showDeleted': false,
        'singleEvents': true,
        'maxResults': 5,
        'orderBy': 'startTime'
      }).then(function(response) {
        var events = response.result.items;
        var list = document.getElementById('events-list');
        list.innerHTML = '';

        if (events.length > 0) {
          for (var i = 0; i < events.length; i++) {
            var event = events[i];
            var when = event.start.dateTime || event.start.date;
            var fechaCorta = when.substring(0, 10);
            
            var item = document.createElement('div');
            item.className = 'event-item';
            item.innerHTML = '<span class="event-time">' + fechaCorta + '</span>' + event.summary;
            list.appendChild(item);
          }
        } else {
          list.innerHTML = '<div class="event-item">No hay eventos próximos.</div>';
        }
      });
    }

    handleClientLoad();
  </script>
</body>
</html>
